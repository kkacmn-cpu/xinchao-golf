<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>신짜오 골프 카카오톡 상담</title>
<noscript><meta http-equiv="refresh" content="3;url=https://pf.kakao.com/_xdBALn/chat"></noscript>
<script src="https://company-site-monitor.vercel.app/tracker.js?site=xinchao-golf" data-company-site-tracker="xinchao-golf" id="co-tracker" async onload="window.__coLoaded=1;if(window.__coCb)window.__coCb()" onerror="window.__coFail=1;if(window.__coCb)window.__coCb()"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f6f7f9;color:#222;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
main{padding:32px 20px;max-width:420px}
h1{font-size:20px;margin:0 0 12px}
p{color:#555;line-height:1.6;margin:0 0 20px}
a.kakao{display:inline-block;background:#fee500;color:#191919;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:12px;font-size:17px}
</style>
</head>
<body>
<main>
<h1>신짜오 골프 카카오톡 상담으로 이동합니다</h1>
<p>날짜·인원만 보내 주시면 카톡으로 견적 드려요.<br>잠시 후 자동으로 열립니다.</p>
<a class="kakao" id="go-kakao" href="https://pf.kakao.com/_xdBALn/chat" rel="nofollow">카카오톡 상담 열기</a>
</main>
<script>
(function(){
  var a=document.getElementById('go-kakao'),moved=false,started=Date.now();
  function go(){if(moved)return;moved=true;location.href=a.href;}
  // tracker가 클릭(booking_kakao_open)을 기록할 틈을 주고 이동
  a.addEventListener('click',function(e){e.preventDefault();setTimeout(go,350);});
  function auto(){var wait=Math.max(0,1500-(Date.now()-started));setTimeout(function(){a.click();},wait+700);}
  function ready(){if(window.__coFail)setTimeout(go,300);else auto();}
  if(window.__coLoaded||window.__coFail)ready();else window.__coCb=ready;
  setTimeout(go,4500); // tracker가 늦거나 막혀도 이동
})();
</script>
</body>
</html>
